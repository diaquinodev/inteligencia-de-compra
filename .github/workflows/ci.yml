name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um push novo na mesma branch cancela a verificação anterior, que já não interessa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# O workflow só lê o repositório: não precisa de mais nada.
permissions:
  contents: read

jobs:
  check:
    name: lint, tipos e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: sqlfluff lint sql
      - run: pytest -q
