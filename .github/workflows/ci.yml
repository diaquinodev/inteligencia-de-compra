name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um push novo na mesma branch cancela a verificação anterior, que já não interessa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# O workflow só lê o repositório: não precisa de mais nada.
permissions:
  contents: read

jobs:
  check:
    name: lint, tipos e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: sqlfluff lint sql
      - run: pytest -q
