name: Dados

# Recria as tabelas, testa e compara com a referência. Toda segunda-feira e por disparo manual.
# Mantém as tabelas vivas (o modo gratuito do BigQuery apaga em 60 dias) e acusa quando a
# origem pública muda o resultado.
on:
  schedule:
    - cron: "0 9 * * 1" # segundas, 09:00 UTC (06:00 em Brasília)
  workflow_dispatch:

# Duas execuções ao mesmo tempo recriariam as mesmas tabelas uma por cima da outra.
concurrency:
  group: dados
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # o GitHub prova ao Google quem é; não existe chave guardada

jobs:
  executar:
    name: recriar, testar e comparar
    # Só roda depois que o acesso ao Google Cloud foi configurado (docs/acesso-bigquery.md).
    if: ${{ vars.GCP_PROVEDOR != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_PROVEDOR }}
          service_account: ${{ vars.GCP_CONTA_DE_SERVICO }}
      - run: pip install -e .
      - run: python -m compras executar
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorio
          path: relatorios/
          if-no-files-found: ignore
