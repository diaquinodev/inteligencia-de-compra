name: Dados

# Recria as tabelas, testa e compara com a referência. Todo dia e por disparo manual.
# Mantém as tabelas vivas (o modo gratuito do BigQuery apaga em 60 dias) e acusa quando a
# origem pública muda o resultado.
on:
  schedule:
    - cron: "0 9 * * *" # todo dia, 09:00 UTC (06:00 em Brasília)
  workflow_dispatch:

# Duas execuções ao mesmo tempo recriariam as mesmas tabelas uma por cima da outra.
concurrency:
  group: dados
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # o GitHub prova ao Google quem é; não existe chave guardada

jobs:
  executar:
    name: recriar, testar e comparar
    # Só roda depois que o acesso ao Google Cloud foi configurado (docs/acesso-bigquery.md).
    if: ${{ vars.GCP_PROVEDOR != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_PROVEDOR }}
          service_account: ${{ vars.GCP_CONTA_DE_SERVICO }}
      - run: pip install -e .
      # Antes de usar a identidade do robô, prova que ela não sai do limite.
      - run: python scripts/provar_limite_do_robo.py
      - run: python -m compras executar
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorio
          path: relatorios/
          if-no-files-found: ignore
